# Gateway MCP - Local Development Configuration
# Loaded when GATEWAY_ENV=local

env: local
executor_backend: docker_exec

services:
  # brs-teesheet: prefer API calls, docker exec for console commands only
  teesheet:
    container: brs-teesheet-php-1  # Container name in brs-teesheet docker-compose (usually 'php')
    url: http://localhost:8056  # Symfony app with REST APIs
  teesheet-db:
    container: brs-teesheet-mysqlhost-1  # MySQL container for SQL queries
  admin_api:
    url: http://localhost:8056  # Same app, different routes /{clubId}/api/admin/...
  config_api:
    url: http://localhost:8056  # Same app, /{clubId}/api/v3/...
  mysql:
    container: brs-mysql
    db: brsgolf_admin  # Admin database with cross_ref table
  mongo:
    container: brs-mongo
    db: brs

audit:
  stdout: true
  langfuse: true

# Credentials subsystem
credentials:
  providers:
    atlassian:
      type: oauth
      client_id_env: ATLASSIAN_CLIENT_ID
      client_secret_env: ATLASSIAN_CLIENT_SECRET
      authz_url: https://auth.atlassian.com/authorize
      token_url: https://auth.atlassian.com/oauth/token
      default_scopes:
        - read:jira-work
        - write:jira-work
      redirect_uri: http://localhost:8000/api/credentials/atlassian/callback
    github:
      type: pat
      validate_url: https://api.github.com/user
      default_required_scopes:
        - repo
        - read:user
      token_creation_hint_url: https://github.com/settings/tokens/new

# Upstream MCP servers
upstream_mcps:
  atlassian:
    url: https://mcp.atlassian.com/v1/mcp
    auth_mode: oauth
    provider: atlassian
  github:
    url: https://api.githubcopilot.com/mcp/
    auth_mode: pat
    provider: github
