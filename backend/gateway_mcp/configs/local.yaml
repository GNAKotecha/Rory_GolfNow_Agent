# Gateway MCP - Local Development Configuration
# Loaded when GATEWAY_ENV=local

env: local
executor_backend: docker_exec

services:
  teesheet:
    container: brs-teesheet
  admin_api:
    url: http://localhost:8100
  config_api:
    url: http://localhost:8101
  mysql:
    container: brs-mysql
    db: brs
  mongo:
    container: brs-mongo
    db: brs

audit:
  stdout: true
  langfuse: true

# Credentials subsystem
credentials:
  providers:
    atlassian:
      type: oauth
      client_id_env: ATLASSIAN_CLIENT_ID
      client_secret_env: ATLASSIAN_CLIENT_SECRET
      authz_url: https://auth.atlassian.com/authorize
      token_url: https://auth.atlassian.com/oauth/token
      default_scopes:
        - read:jira-work
        - write:jira-work
      redirect_uri: http://localhost:8000/api/credentials/atlassian/callback
    github:
      type: pat
      validate_url: https://api.github.com/user
      default_required_scopes:
        - repo
        - read:user
      token_creation_hint_url: https://github.com/settings/tokens/new

# Upstream MCP servers
upstream_mcps:
  atlassian:
    url: https://mcp.atlassian.com/v1/mcp
    auth_mode: oauth
    provider: atlassian
  github:
    url: https://api.githubcopilot.com/mcp/
    auth_mode: pat
    provider: github
